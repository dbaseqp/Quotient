name: Quotient Test Suite

on:
  push:
    branches-ignore:
      - 'dependabot/**'
  pull_request:
    branches-ignore:
      - 'dependabot/**'

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Run unit tests
        run: go test -v -race -short ./engine/... ./www/... ./runner/...

      - name: Run unit tests with coverage
        run: go test -v -race -short -coverprofile=coverage.out -covermode=atomic ./...

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v2

      - name: Setup Compose stack
        run: docker compose up db redis -d

      - name: Run integration tests
        # -p 1 runs one package binary at a time. These packages share a single
        # Postgres database and a single Redis instance, and they use fixed
        # names for both (the `tasks` and `results` lists, one schema). Running
        # them concurrently lets one package consume the other's queued tasks
        # and reset its rows.
        run: go test -v -race -p 1 ./tests/integration/... ./engine/... -timeout 10m
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: engine
          POSTGRES_USER: engineuser
          POSTGRES_PASSWORD: postgres_password

  security-scanner:
    name: Security Scanner
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Run gosec security scanner
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          # G117: false positive on intentional struct fields (RefreshToken in Redis DTO, Password in login request)
          # G120: false positive — all form handlers use http.MaxBytesReader and ParseMultipartForm size limits
          # G124: Secure flag is intentionally dynamic via cookieSecure() to support both HTTP and HTTPS deployments
          # G706: false positive with log/slog structured logging (values are auto-escaped)
          gosec -exclude=G117,G120,G124,G706 -exclude-generated -exclude-dir=divisor -exclude-dir=.worktrees ./...

  property-tests:
    name: Property-Based Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.25'
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Run property-based tests (extended)
        run: go test -v ./engine/... -run Property -rapid.checks=5000 -timeout 15m