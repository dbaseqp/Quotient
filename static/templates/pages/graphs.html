{{ define "page" }}
<div class="d-flex w-100 h-100">
    <div class="pt-4 w-100 h-100 overflow-y-scroll">
        <div class="container">
            <div class="row">
                <p>Last updated graphs at: <span id="updatedAt"></span></p>
            </div>
            <div class="row gy-4 mb-4">
                <div class="col col-12">
                    <div class="card overflow-y-scroll">
                        <div class="card-img-top graph" id="service-status"></div>
                        <script>
                            const getChartTheme = () => document.documentElement.getAttribute('data-bs-theme') === 'dark' ? 'dark' : 'light';
                            // The API marks only the viewer's own team with Self, which is shown by color alone.
                            const SELF_COLOR = '#775DD0'
                            const OTHER_COLORS = ['#008FFB', '#00E396', '#FEB019', '#FF4560'] // ApexCharts' palette without SELF_COLOR
                            // Moves the viewer's series last: the top row of a heatmap, the topmost line of a line chart.
                            const pinSelfToTop = (series) => [...series.filter((s) => !s.self), ...series.filter((s) => s.self)]
                            // Labels are matched by position, since on an anonymized scoreboard they all read "Team".
                            // Runs after every render, since ApexCharts redraws labels on resize and theme changes.
                            const highlightSelfLabel = (selfLabelIndex) => (chartContext) => {
                                const selfIndex = selfLabelIndex()
                                chartContext.el.querySelectorAll('.apexcharts-yaxis-label').forEach((label, i) => {
                                    label.style.fill = i === selfIndex ? SELF_COLOR : ''
                                    label.style.fontWeight = i === selfIndex ? '700' : ''
                                })
                            }
                            // A heatmap's y-axis labels start with a blank one, then go top row first, where pinSelfToTop puts the viewer.
                            const heatmapSelfLabel = (hasSelf) => highlightSelfLabel(() => hasSelf() ? 1 : -1)
                            let TEAMIDS = []
                            let STATUS_HAS_SELF = false
                            let ROUNDID = 0
                            let options = {
                                series: [],
                                chart: {
                                    type: 'heatmap',
                                    background: 'transparent',
                                    events: {
                                        dataPointSelection: function(event, chartContext, config) {
                                            const serviceName = chartContext.w.globals.categoryLabels[config.dataPointIndex]
                                            const teamID = TEAMIDS[config.seriesIndex]
                                            if (teamID !== undefined) {
                                                window.location.href = `/services?team=${teamID}&service=${serviceName}&round=${ROUNDID}`
                                            }
                                        },
                                        mounted: heatmapSelfLabel(() => STATUS_HAS_SELF),
                                        updated: heatmapSelfLabel(() => STATUS_HAS_SELF),
                                    }
                                },
                                stroke: {
                                    width: 1
                                },
                                legend: {
                                    show: false,
                                },
                                tooltip: {
                                    enabled: false,
                                },
                                plotOptions: {
                                    heatmap: {
                                        // radius: 30,
                                        enableShades: true,
                                        colorScale: {
                                            ranges: [
                                                {
                                                    from: 0,
                                                    to: 0,
                                                    color: '#777777'
                                                },
                                                {
                                                    from: 1,
                                                    to: 1,
                                                    color: '#3D9970'
                                                },
                                                {
                                                    from: 2,
                                                    to: 2,
                                                    color: '#AA0707'
                                                },
                                            ],
                                        },

                                    }
                                },
                                theme: {
                                    mode: getChartTheme(),
                                },
                                dataLabels: {
                                    enabled: false
                                },
                                xaxis: {
                                    labels: {
                                        rotate: -55,
                                        rotateAlways: true,
                                    }
                                },
                                title: {
                                    text: 'Service Status',
                                },
                            };

                            const UPIMG = "/static/assets/services/up.png"
                            const DOWNIMG = "/static/assets/services/down.png"
                            const UNKIMG = "/static/assets/services/pending.png"
                            const STATUSCHART = new ApexCharts(document.querySelector("#service-status"), options);
                            STATUSCHART.render()
                            async function fetchStatus() {
                                let series;

                                await fetch("/api/graphs/services")
                                    .then((response) => {
                                        if (!response.ok) {
                                            return Promise.reject(response)
                                        }
                                        return response.json()
                                    })
                                    .then((data) => {
                                        console.log(data)
                                        ROUNDID = data.roundID
                                        series = data.series.map((service) => {
                                            return {
                                                name: service.Name,
                                                teamID: service.ID || undefined,
                                                self: !!service.Self,
                                                data: service.Data.map((status) => {
                                                    return {
                                                        x: status.X,
                                                        y: status.Y,
                                                    }
                                                }).sort((a, b) => {
                                                    return a.x.localeCompare(b.x)
                                                })
                                            }
                                        })
                                        if (!series.every((s) => s.name === "Team")) {
                                            series.sort((a, b) => b.name.localeCompare(a.name))
                                        }
                                        series = pinSelfToTop(series)
                                        TEAMIDS = series.map((s) => s.teamID)
                                        STATUS_HAS_SELF = series.some((s) => s.self)
                                    })
                                if (!series || !series.length || !series[0].data.length) {
                                    await STATUSCHART.updateOptions({
                                        series: [],
                                        xaxis: { categories: [] },
                                    })
                                    STATUSCHART.clearAnnotations()
                                    return
                                }
                                const categories = series[0].data.map((status) => {
                                    return status.x
                                }).sort((a, b) => {
                                    return a.localeCompare(b)
                                })

                                await STATUSCHART.updateOptions({
                                    chart: {
                                        height: 170+17*series.length,
                                    },
                                    series: series,
                                    xaxis: {
                                        categories: categories,
                                    }
                                })
                                // y value is based on y value for some reason, so manually setting y value to
                                // consistent value for all series to make sure the images are at a consistent height
                                STATUSCHART.clearAnnotations()
                                for (let i = 0; i < series.length; i++) {
                                    for (let j = 0; j < series[i].data.length; j++) {
                                        let status = series[i].data[j]
                                        let img;
                                        if (status.y === 1) {
                                            img = UPIMG
                                        } else if (status.y == 2) {
                                            img = DOWNIMG
                                        } else {
                                            img = UNKIMG
                                        }

                                        const teamID = TEAMIDS[i]
                                        const serviceName = status.x
                                        const pointID = `status-${i}-${j}`
                                        const rowHeight = STATUSCHART.w.globals.gridHeight / series.length;
                                        
                                        let point = {
                                            x: serviceName,
                                            y: STATUSCHART.w.globals.yRange[0],
                                            seriesIndex: i,
                                            id: pointID,
                                            image: {
                                                path: img,
                                                offsetY: (rowHeight * series.length) + (rowHeight / 2) - (i * rowHeight) - rowHeight,
                                            },
                                            click: () => {
                                                if (teamID !== undefined) {
                                                    window.location.href = `/services?team=${teamID}&service=${serviceName}&round=${ROUNDID}`
                                                }
                                            }
                                        }

                                        STATUSCHART.addPointAnnotation(point)
                                    }
                                }
                            }
                        </script>
                        <div class="card-body">
                            <p class="card-text">Current Service Status</p>
                            <button class="btn btn-primary fullscreen">Fullscreen</button>
                        </div>
                    </div>
                </div>
                <div class="col col-12">
                    <div class="card overflow-y-scroll">
                        <div class="card-img-top graph" id="score-status"></div>
                        <div class="card-body">
                            <p class="card-text">Scores Over Time</p>
                            <button class="btn btn-primary fullscreen">Fullscreen</button>
                        </div>
                    </div>
                </div>
                <div class="col col-12">
                    <div class="card overflow-y-scroll">
                        <div class="card-img-top graph" id="uptime-status"></div>
                        <script>
                            let UPTIME_HAS_SELF = false
                            let options3 = {
                                series: [],
                                chart: {
                                    type: 'heatmap',
                                    background: 'transparent',
                                    events: {
                                        mounted: heatmapSelfLabel(() => UPTIME_HAS_SELF),
                                        updated: heatmapSelfLabel(() => UPTIME_HAS_SELF),
                                    },
                                },
                                stroke: {
                                    width: 1
                                },
                                legend: {
                                    show: false,
                                },
                                tooltip: {
                                    enabled: true,
                                    y: {
                                        formatter: function (value) {
                                            if (value === -1) {
                                                return "N/A"
                                            }
                                            return value + "%"
                                        }
                                    }
                                },
                                plotOptions: {
                                    heatmap: {
                                        // radius: 30,
                                        enableShades: true,
                                        colorScale: {
                                            ranges: [
                                                {
                                                    from: -1,
                                                    to: -1,
                                                    color: '#777777'
                                                },
                                                {
                                                    from: 0,
                                                    to: 50,
                                                    color: '#AA0707'
                                                },
                                                {
                                                    from: 50,
                                                    to: 80,
                                                    color: '#FFB200'
                                                },
                                                {
                                                    from: 80,
                                                    to: 100,
                                                    color: '#3D9970'
                                                },
                                            ],
                                        },

                                    }
                                },
                                theme: {
                                    mode: getChartTheme(),
                                },
                                dataLabels: {
                                    enabled: true,
                                    formatter: function (value) {
                                        if (value === -1) {
                                            return "N/A"
                                        }
                                        return value + "%"
                                    }
                                },
                                xaxis: {
                                    labels: {
                                        rotate: -55,
                                        rotateAlways: true,
                                    }
                                },
                                title: {
                                    text: 'Uptime Status',
                                },
                            };

                            let UPTIMECHART = new ApexCharts(document.querySelector("#uptime-status"), options3);
                            UPTIMECHART.render();

                            async function fetchUptime() {
                                let series;

                                await fetch("/api/graphs/uptimes")
                                    .then((response) => {
                                        if (!response.ok) {
                                            return Promise.reject(response)
                                        }
                                        return response.json()
                                    })
                                    .then((data) => {
                                        console.log(data)
                                        series = data.series.map((service) => {
                                            return {
                                                name: service.Name,
                                                self: !!service.Self,
                                                data: service.Data.sort((a, b) => { return a.Service.localeCompare(b.Service) }).map((status) => {
                                                    if (status.Uptime === null || status.Uptime < 0) {
                                                        return {
                                                            x: status.Service,
                                                            y: -1,
                                                        }
                                                    }
                                                    return {
                                                        x: status.Service,
                                                        y: Math.round(status.Uptime * 100),
                                                    }
                                                })
                                            }
                                        })
                                        if (!series.every((s) => s.name === "Team")) {
                                            series.sort((a, b) => b.name.localeCompare(a.name))
                                        }
                                        series = pinSelfToTop(series)
                                        UPTIME_HAS_SELF = series.some((s) => s.self)
                                    })

                                if (!series || !series.length || !series[0].data.length) {
                                    await UPTIMECHART.updateOptions({
                                        series: [],
                                        xaxis: { categories: [] },
                                    })
                                    return
                                }
                                const categories = series[0].data.map((status) => {
                                    return status.x
                                }).sort((a, b) => {
                                    return a.localeCompare(b)
                                })

                                await UPTIMECHART.updateOptions({
                                    series: series,
                                    xaxis: {
                                        categories: categories,
                                    }
                                })
                            }
                        </script>
                        <div class="card-body">
                            <p class="card-text">Uptime</p>
                            <button class="btn btn-primary fullscreen">Fullscreen</button>
                        </div>
                    </div>
                </div>
                <div class="col col-12">
                    <div class="card overflow-y-scroll">
                        <div class="card-img-top graph" id="leaderboard-status"></div>
                        <script>
                            let options1 = {
                                series: [],
                                chart: {
                                    type: 'line',
                                    background: 'transparent',
                                    animations: {
                                        enabled: false,
                                    },
                                    zoom: {
                                        enabled: false,
                                    },
                                },
                                stroke: {
                                    curve: 'straight',
                                },
                                legend: {
                                    show: false,
                                },
                                tooltip: {
                                    enabled: true,
                                },
                                theme: {
                                    mode: getChartTheme(),
                                },
                                dataLabels: {
                                    enabled: false
                                },
                                title: {
                                    text: 'Scores Over Time',
                                },
                            };

                            const SCORECHART = new ApexCharts(document.querySelector("#score-status"), options1);
                            SCORECHART.render();

                            let LEADERBOARD_SELF = -1
                            let options2 = {
                                series: [{ data: [] }],
                                chart: {
                                    type: 'bar',
                                    background: 'transparent',
                                    events: {
                                        mounted: highlightSelfLabel(() => LEADERBOARD_SELF),
                                        updated: highlightSelfLabel(() => LEADERBOARD_SELF),
                                    },
                                    animations: {
                                        enabled: false,
                                    },
                                    zoom: {
                                        enabled: false,
                                    },
                                },
                                theme: {
                                    mode: getChartTheme(),
                                },
                                plotOptions: {
                                    bar: {
                                        horizontal: true,
                                    }
                                },
                                dataLabels: {
                                    enabled: true,
                                },
                                title: {
                                    text: 'Leaderboard',
                                },
                            };

                            const LEADERBOARDCHART = new ApexCharts(document.querySelector("#leaderboard-status"), options2);
                            LEADERBOARDCHART.render();
                            async function fetchScores() {
                                let series;

                                await fetch("/api/graphs/scores")
                                    .then((response) => {
                                        if (!response.ok) {
                                            return Promise.reject(response)
                                        }
                                        return response.json()
                                    })
                                    .then((data) => {
                                        console.log(data)
                                        series = data.series.map((team) => {
                                            if (team.Data === null) {
                                                return {
                                                    name: team.Name,
                                                    self: !!team.Self,
                                                    data: []
                                                }
                                            }
                                            return {
                                                name: team.Name,
                                                self: !!team.Self,
                                                data: team.Data.map((point) => {
                                                    return {
                                                        x: point.Round,
                                                        y: point.Total,
                                                    }
                                                })
                                            }
                                        })
                                    })

                                const firstWithData = series && series.find((s) => s.data.length > 0)
                                if (!firstWithData) {
                                    await SCORECHART.updateOptions({
                                        series: [],
                                        xaxis: { categories: [] },
                                    })
                                    await LEADERBOARDCHART.updateOptions({
                                        series: [{ data: [] }],
                                        xaxis: { categories: [] },
                                    })
                                    return
                                }
                                const categories = firstWithData.data.map((status) => {
                                    return status.x
                                })

                                // Later series draw on top, so the viewer's line goes last.
                                const lines = pinSelfToTop(series)
                                await SCORECHART.updateOptions({
                                    legend: {
                                        show: !lines.every((s) => s.name === "Team"),
                                    },
                                    stroke: {
                                        width: lines.map((s) => s.self ? 5 : 2),
                                    },
                                    colors: lines.map((s, i) => s.self ? SELF_COLOR : OTHER_COLORS[i % OTHER_COLORS.length]),
                                    series: lines,
                                    xaxis: {
                                        categories: categories,
                                    }
                                })

                                // reusing data for leaderboard bar chart
                                let leaderboard_series = series.map((team) => {
                                    if (team.data.length === 0) {
                                        return {
                                            name: team.name,
                                            self: team.self,
                                            data: 0
                                        }
                                    }
                                    return {
                                        name: team.name,
                                        self: team.self,
                                        data: team.data[team.data.length - 1].y
                                    }
                                }).sort((a, b) => {
                                    return b.data - a.data
                                })
                                LEADERBOARD_SELF = leaderboard_series.findIndex((team) => team.self)

                                await LEADERBOARDCHART.updateOptions({
                                    plotOptions: {
                                        bar: { horizontal: true, distributed: true },
                                    },
                                    legend: { show: false },
                                    colors: leaderboard_series.map((team) => team.self ? SELF_COLOR : OTHER_COLORS[0]),
                                    series: [{
                                        name: 'Service Score',
                                        data: leaderboard_series.reduce((acc, team) => {
                                            acc.push(team.data)
                                            return acc
                                        }, [])
                                    }],
                                    xaxis: {
                                        categories: leaderboard_series.map((team) => {
                                            return team.name
                                        }),
                                    }
                                })
                            }
                        </script>
                        <div class="card-body">
                            <p class="card-text">Leaderboard</p>
                            <button class="btn btn-primary fullscreen">Fullscreen</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    document.querySelectorAll(".fullscreen").forEach((button) => {
        button.addEventListener("click", () => {
            const card = button.closest(".card")
            if (document.fullscreenElement === card && document.exitFullscreen) {
                document.exitFullscreen();
                return;
            }
            card.requestFullscreen?.();
        })
    })

    document.addEventListener("fullscreenchange", () => {
        document.querySelectorAll(".fullscreen").forEach((button) => {
            const isFs = document.fullscreenElement === button.closest(".card");
            button.textContent = isFs ? "Exit Fullscreen" : "Fullscreen";
            button.setAttribute("aria-pressed", isFs ? "true" : "false");
        });
        window.dispatchEvent(new Event("resize"));
    });

    new MutationObserver(() => {
        const mode = getChartTheme();
        [STATUSCHART, SCORECHART, UPTIMECHART, LEADERBOARDCHART].forEach((chart) => {
            chart.updateOptions({ theme: { mode } });
        });
    }).observe(document.documentElement, { attributes: true, attributeFilter: ["data-bs-theme"] });

    let isRefreshing = false;
    async function refreshGraphs() {
        if (isRefreshing) return;
        isRefreshing = true;
        try {
            await Promise.all([fetchStatus(), fetchUptime(), fetchScores()]);
            document.getElementById("updatedAt").innerText = new Date().toLocaleString();
        } catch (err) {
            console.error("Failed to refresh graphs:", err);
        } finally {
            isRefreshing = false;
        }
    }

    document.addEventListener("DOMContentLoaded", () => {
        refreshGraphs();
        setInterval(refreshGraphs, 30000);
    });
</script>
{{ end }}
