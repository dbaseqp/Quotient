{{ define "page" }}
<div class="d-flex w-100 h-100">
    <div class="pt-4 w-100 h-100 overflow-y-scroll">
        <div class="container">
            <div class="row">
                <div class="row mb-3">
                    <div class="mb-3">
                        <h3>Engine Controls</h3>
                        <button id="pauseButton" class="btn rounded-0"></button>
                        <button id="resetButton" class="btn btn-danger rounded-0">Reset Scores</button>
                        <button id="competitionStartButton" class="btn rounded-0"></button>
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col">
                        <h3>Competition Schedule</h3>
                        <form id="scheduleForm" class="row g-3 align-items-end">
                            <div class="col-md-4">
                                <label for="scheduleStartTime" class="form-label">Start Time</label>
                                <input type="datetime-local" id="scheduleStartTime" class="form-control">
                            </div>
                            <div class="col-md-4">
                                <label for="scheduleEndTime" class="form-label">End Time</label>
                                <input type="datetime-local" id="scheduleEndTime" class="form-control">
                            </div>
                            <div class="col-md-4 d-flex gap-2">
                                <button type="submit" id="saveScheduleButton" class="btn btn-primary">Save Schedule</button>
                                <button type="button" id="clearScheduleButton" class="btn btn-outline-secondary" title="Forget the runtime schedule and use event.conf">Clear</button>
                            </div>
                        </form>
                        <div id="scheduleSummary" class="form-text mt-2">No schedule: set one here or in event.conf.</div>
                        <div id="scheduleFeedback" class="alert mt-2 py-2 d-none" role="alert"></div>
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col">
                        <h3>Round Progress</h3>
                        <p id="round__number"></p>
                        <div class="progress">
                            <div id="roundProgress"
                                class="progress-bar progress-bar-striped progress-bar-animated bg-success"
                                role="progressbar" style="width: 0%;" aria-valuenow="0" aria-valuemin="0"
                                aria-valuemax="100"></div>
                        </div>
                    </div>
                </div>
                <div class="row mb-3">
                    <div class="col">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h3 class="mb-0">Scoring Data</h3>
                            <div>
                                <button class="btn btn-primary me-2" onclick="exportJSON()">Export JSON</button>
                                <button class="btn btn-primary me-2" onclick="exportCSV()">Export CSV</button>
                                <button class="btn btn-primary" onclick="exportTimelapse(this)">Export Timelapse</button>
                            </div>
                        </div>
                        <div class="card">
                            <div class="card-body">
                                <pre id="scoringData" class="m-0"></pre>
                            </div>
                        </div>
                    </div>
                </div>
                <script>
                    const PROGRESS = document.getElementById('roundProgress');
                    let LASTROUND = 0;
                    let CURRENTROUND = 0;
                    let NEXTROUND = 0;
                    let RUNNING = false;
                    let COMPETITION_STARTED = false;

                    document.getElementById('pauseButton').addEventListener('click', () => {
                        fetch('/api/engine/pause', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json',
                            },
                            body: JSON.stringify({
                                pause: document.getElementById('pauseButton').textContent.includes('Pause'),
                            }),
                        })
                            .then(response => response.json())
                            .then((data) => {
                                window.location.reload()
                            })
                            .catch(error => console.error('Error pausing engine:', error));
                    });
                    document.getElementById('resetButton').addEventListener('click', () => {
                        if (confirm("This will reset all scores and the engine but keep injects and their submissions. Are you sure?")) {
                            fetch('/api/engine/reset')
                                .then(response => response.json())
                                .then((data) => {
                                    window.location.reload()
                                })
                                .catch(error => {
                                    console.error('Error resetting engine:', error)
                                });
                        }
                    });
                    document.getElementById('competitionStartButton').addEventListener('click', () => {
                        const action = COMPETITION_STARTED ? 'stop' : 'start';
                        const message = COMPETITION_STARTED
                            ? "This will prevent non-admin users from accessing the competition. Are you sure?"
                            : "This will allow non-admin users to access the competition. Are you sure?";

                        if (confirm(message)) {
                            fetch('/api/competition/start', {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json',
                                },
                                body: JSON.stringify({
                                    started: !COMPETITION_STARTED,
                                }),
                            })
                                .then(response => response.json())
                                .then((data) => {
                                    window.location.reload()
                                })
                                .catch(error => console.error('Error toggling competition start:', error));
                        }
                    });
                    function getEngineData() {
                        fetch('/api/engine')
                            .then(response => response.json())
                            .then(data => {
                                LASTROUND = data["last_round"];
                                CURRENTROUND = data["current_round_time"];
                                NEXTROUND = data["next_round_time"];
                                RUNNING = data["running"];
                                COMPETITION_STARTED = data["competition_started"];

                                let last_round_start_time = new Date(LASTROUND.StartTime).toLocaleString();
                                let current_round_time = new Date(CURRENTROUND).toLocaleString();
                                let next_round_time = new Date(NEXTROUND).toLocaleString();

                                document.getElementById('round__number').textContent = `Round ${LASTROUND.ID} was at ${last_round_start_time}.
                                Round ${LASTROUND.ID + 1} started at ${current_round_time} and should end at ${next_round_time}.`;

                                const PAUSE_BUTTON = document.getElementById('pauseButton')
                                PAUSE_BUTTON.classList.remove('btn-warning', 'btn-success');
                                if (RUNNING) {
                                    PAUSE_BUTTON.textContent = 'Pause Engine';
                                    PAUSE_BUTTON.classList.add('btn-warning');
                                } else {
                                    PAUSE_BUTTON.textContent = 'Resume Engine';
                                    PAUSE_BUTTON.classList.add('btn-success');
                                }

                                const COMP_START_BUTTON = document.getElementById('competitionStartButton')
                                COMP_START_BUTTON.classList.remove('btn-danger', 'btn-success');
                                if (COMPETITION_STARTED) {
                                    COMP_START_BUTTON.textContent = 'Stop Competition';
                                    COMP_START_BUTTON.classList.add('btn-danger');
                                } else {
                                    COMP_START_BUTTON.textContent = 'Start Competition';
                                    COMP_START_BUTTON.classList.add('btn-success');
                                }

                                updateScheduleInputs(data["scheduled_start_time"], data["scheduled_end_time"], data["schedule_source"]);
                            })
                            .catch(error => console.error('Error fetching engine status:', error));
                    }
                    // SCHEDULE mirrors the server's effective schedule; the inputs are dirty when they differ from it.
                    let SCHEDULE = { start: null, end: null, source: 'none' };
                    const SCHEDULE_START_INPUT = document.getElementById('scheduleStartTime');
                    const SCHEDULE_END_INPUT = document.getElementById('scheduleEndTime');
                    const SCHEDULE_SOURCES = {
                        runtime: 'set here, replacing event.conf',
                        config: 'from event.conf',
                    };
                    function toDateTimeLocalValue(isoString) {
                        if (!isoString) {
                            return '';
                        }
                        const date = new Date(isoString);
                        if (Number.isNaN(date.getTime())) {
                            return '';
                        }
                        const tzOffset = date.getTimezoneOffset() * 60000;
                        return new Date(date.getTime() - tzOffset).toISOString().slice(0, 16);
                    }
                    function scheduleFormDirty() {
                        return SCHEDULE_START_INPUT.value !== toDateTimeLocalValue(SCHEDULE.start)
                            || SCHEDULE_END_INPUT.value !== toDateTimeLocalValue(SCHEDULE.end);
                    }
                    function renderScheduleSummary() {
                        const summary = document.getElementById('scheduleSummary');
                        const parts = [];
                        if (SCHEDULE.start) {
                            parts.push(`Planned start ${new Date(SCHEDULE.start).toLocaleString()}`);
                        }
                        if (SCHEDULE.end) {
                            parts.push(`Ends ${new Date(SCHEDULE.end).toLocaleString()}`);
                        }
                        summary.textContent = parts.length > 0
                            ? `${parts.join(' · ')} (${SCHEDULE_SOURCES[SCHEDULE.source]})`
                            : 'No schedule: set one here or in event.conf.';
                    }
                    function updateScheduleInputs(startISO, endISO, source) {
                        SCHEDULE = { start: startISO, end: endISO, source: source };
                        SCHEDULE_START_INPUT.value = toDateTimeLocalValue(startISO);
                        SCHEDULE_END_INPUT.value = toDateTimeLocalValue(endISO);
                        renderScheduleSummary();
                    }
                    function showScheduleFeedback(message, isError) {
                        const feedback = document.getElementById('scheduleFeedback');
                        feedback.textContent = message;
                        feedback.className = `alert mt-2 py-2 ${isError ? 'alert-danger' : 'alert-success'}`;
                    }
                    async function saveSchedule(startValue, endValue) {
                        const saveBtn = document.getElementById('saveScheduleButton');
                        const clearBtn = document.getElementById('clearScheduleButton');
                        const startISO = startValue ? new Date(startValue).toISOString() : '';
                        const endISO = endValue ? new Date(endValue).toISOString() : '';

                        saveBtn.disabled = true;
                        clearBtn.disabled = true;
                        try {
                            const response = await fetch('/api/competition/schedule', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({
                                    start_time: startISO,
                                    end_time: endISO,
                                }),
                            });
                            const data = await response.json().catch(() => ({}));
                            if (!response.ok || data.error) {
                                showScheduleFeedback(data.error || `Failed to save schedule (${response.status})`, true);
                                return;
                            }
                            showScheduleFeedback(startISO || endISO ? 'Schedule saved.' : 'Runtime schedule cleared; event.conf applies.', false);
                            getEngineData();
                        } catch (error) {
                            showScheduleFeedback('Failed to save schedule: ' + error.message, true);
                        } finally {
                            saveBtn.disabled = false;
                            clearBtn.disabled = false;
                        }
                    }
                    document.getElementById('scheduleForm').addEventListener('submit', (event) => {
                        event.preventDefault();
                        saveSchedule(SCHEDULE_START_INPUT.value, SCHEDULE_END_INPUT.value);
                    });
                    document.getElementById('clearScheduleButton').addEventListener('click', () => {
                        saveSchedule('', '');
                    });
                    function updateProgress() {
                        const now = Date.now() / 1000; // current time in seconds
                        let last_round_start_time = new Date(CURRENTROUND) / 1000;
                        let next_round_start_time = new Date(NEXTROUND) / 1000;

                        const elapsed = now - last_round_start_time;
                        const duration = next_round_start_time - last_round_start_time;

                        const progress = Math.round((elapsed / duration) * 100);

                        if (progress >= 100) {
                            PROGRESS.textContent = '100%';
                            PROGRESS.style.width = '100%';
                            PROGRESS.setAttribute('aria-valuenow', 100);
                            if (RUNNING && !scheduleFormDirty()) {
                                window.location.reload();
                            }
                            return;
                        }

                        PROGRESS.textContent = `${progress}%`;

                        PROGRESS.style.width = `${progress}%`;
                        PROGRESS.setAttribute('aria-valuenow', progress);
                    }
                    function fetchScores() {
                        fetch('/api/engine/export/scores')
                            .then((response) => {
                                if (!response.ok) {
                                    throw new Error('Network response was not ok');
                                }
                                return response.json()
                            })
                            .then((data) => {
                                scoreData = data;
                                document.getElementById('scoringData').textContent = JSON.stringify(data, null, 2);
                            })
                            .catch(error => {
                                console.error('Error fetching scoring data:', error)
                            });
                    }
                    async function exportJSON() {
                        await fetchScores();
                        const dataStr = JSON.stringify(scoreData, null, 2);
                        const dataBlob = new Blob([dataStr], {type: 'application/json'});
                        const url = URL.createObjectURL(dataBlob);
                        const link = document.createElement('a');
                        link.href = url;
                        link.download = 'scoring_data.json';
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);
                        URL.revokeObjectURL(url);
                    }
                    async function exportTimelapse(button) {
                        button.disabled = true;
                        try {
                            const response = await fetch('/api/engine/export/timelapse');
                            if (!response.ok) {
                                const data = await response.json().catch(() => ({}));
                                alert(data.error || `Timelapse export failed (${response.status})`);
                                return;
                            }
                            const url = URL.createObjectURL(await response.blob());
                            const link = document.createElement('a');
                            link.href = url;
                            link.download = 'timelapse.gif';
                            document.body.appendChild(link);
                            link.click();
                            document.body.removeChild(link);
                            URL.revokeObjectURL(url);
                        } catch (error) {
                            console.error('Error exporting timelapse:', error);
                            alert('Timelapse export failed: ' + error.message);
                        } finally {
                            button.disabled = false;
                        }
                    }
                    async function exportCSV() {
                        await fetchScores();
                        const headers = ['Team', 'Service', 'Service Points', 'SLA Violations', 'SLA Penalty', 'Total Points'];
                        const csvRows = [headers.join(',')];

                        scoreData.forEach(team => {
                            team.services.forEach(service => {
                                const row = [
                                    team.team_name,
                                    service.service_name,
                                    service.service_points,
                                    service.sla_violations,
                                    service.sla_penalty,
                                    team.total_points
                                ];
                                csvRows.push(row.join(','));
                            });
                        });

                        const csvStr = csvRows.join('\n');
                        const dataBlob = new Blob([csvStr], {type: 'text/csv'});
                        const url = URL.createObjectURL(dataBlob);
                        const link = document.createElement('a');
                        link.href = url;
                        link.download = 'scoring_data.csv';
                        document.body.appendChild(link);
                        link.click();
                        document.body.removeChild(link);
                        URL.revokeObjectURL(url);
                    }

                    fetchScores();
                    getEngineData()
                    updateProgress()

                    // update every second
                    setInterval(updateProgress, 1000);
                </script>
            </div>
        </div>
    </div>
</div>
{{ end }}
