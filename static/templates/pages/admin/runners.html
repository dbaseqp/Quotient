{{ define "page" }}
<div class="d-flex w-100 h-100">
    <div class="pt-4 w-100 h-100 overflow-y-scroll">
        <div class="container">
            <header class="d-flex flex-wrap justify-content-between align-items-center mb-4 gap-2">
                <div>
                    <h1 class="h3 mb-1">Runner Tasks</h1>
                    <p class="text-body-secondary mb-0">Live telemetry of active service check runner containers.</p>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <div class="form-check form-switch d-inline-block mb-0">
                        <input class="form-check-input" type="checkbox" id="autoRefreshSwitch" checked>
                        <label class="form-check-label" for="autoRefreshSwitch">Auto-refresh</label>
                    </div>
                    <span class="badge text-bg-secondary" id="lastUpdated">Never</span>
                </div>
            </header>

            <!-- Round Progress -->
            <div class="card mb-4">
                <div class="card-body">
                    <h2 class="h5 mb-2">Round Progress</h2>
                    <p id="round__number" class="text-body-secondary small mb-2">Loading round status...</p>
                    <div class="progress" style="height: 1.25rem;">
                        <div id="roundProgress"
                            class="progress-bar progress-bar-striped progress-bar-animated bg-success"
                            role="progressbar" aria-label="Current round progress" style="width: 0%;" aria-valuenow="0" aria-valuemin="0"
                            aria-valuemax="100">0%</div>
                    </div>
                </div>
            </div>

            <!-- Runner Utilization -->
            <div class="card mb-4">
                <div class="card-body">
                    <h2 class="h5 mb-3">Runner Utilization</h2>
                    <div class="d-flex flex-wrap gap-3">
                        <div class="border rounded p-3 text-center" style="min-width: 140px;">
                            <div class="fs-4 fw-bold" id="activeRunnersCount">0</div>
                            <div class="small text-body-secondary">Active Runners</div>
                        </div>
                        <div class="border rounded p-3 text-center" style="min-width: 140px;">
                            <div class="fs-4 fw-bold" id="totalRunnersCount">0</div>
                            <div class="small text-body-secondary">Known Runners</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Active Runners -->
            <div class="card mb-4">
                <div class="card-body">
                    <h2 class="h5 mb-3">Active Runners</h2>
                    <div id="activeRunnersList" class="m-0">Loading runner data...</div>
                </div>
            </div>

            <script>
                let refreshInterval;
                let autoRefreshEnabled = true;
                let lastRolloverFetch = 0;

                const PROGRESS = document.getElementById('roundProgress');
                let LASTROUND = 0;
                let CURRENTROUND = 0;
                let NEXTROUND = 0;
                let RUNNING = false;
                let ROUNDDURATION = 60;

                function updateRunnerTasks() {
                    if (!autoRefreshEnabled) return;

                    fetch('/api/engine/tasks')
                        .then(response => {
                            if (!response.ok) throw new Error(`HTTP ${response.status}`);
                            return response.json();
                        })
                        .then(tasks => {
                            document.getElementById('lastUpdated').textContent = new Date().toLocaleTimeString();

                            const runningTasks = tasks.running || [];
                            const successTasks = tasks.success || [];
                            const failedTasks = tasks.failed || [];

                            const runnerMap = new Map();
                            const activeRunners = new Set();

                            runningTasks.forEach(task => {
                                if (task.runner_id) {
                                    activeRunners.add(task.runner_id);
                                    if (!runnerMap.has(task.runner_id)) {
                                        runnerMap.set(task.runner_id, []);
                                    }
                                    runnerMap.get(task.runner_id).push(task);
                                }
                            });

                            const allRunners = new Set();
                            runningTasks.forEach(task => { if (task.runner_id) allRunners.add(task.runner_id); });
                            successTasks.forEach(task => { if (task.runner_id) allRunners.add(task.runner_id); });
                            failedTasks.forEach(task => { if (task.runner_id) allRunners.add(task.runner_id); });

                            if (tasks.all_runners) {
                                tasks.all_runners.forEach(id => allRunners.add(id));
                            }

                            document.getElementById('activeRunnersCount').textContent = activeRunners.size;
                            document.getElementById('totalRunnersCount').textContent = allRunners.size;

                            const activeRunnersContainer = document.getElementById('activeRunnersList');

                            if (activeRunners.size === 0) {
                                activeRunnersContainer.innerHTML = '<p class="text-body-secondary mb-0">No active runners at the moment.</p>';
                                return;
                            }

                            const table = document.createElement('table');
                            table.className = 'table table-striped align-middle mb-0';

                            const thead = document.createElement('thead');
                            const headerRow = document.createElement('tr');
                            ['Runner', 'Tasks', 'Elapsed Time'].forEach(text => {
                                const th = document.createElement('th');
                                th.scope = 'col';
                                th.textContent = text;
                                headerRow.appendChild(th);
                            });
                            thead.appendChild(headerRow);
                            table.appendChild(thead);

                            const tbody = document.createElement('tbody');

                            [...runnerMap.keys()].sort().forEach(runnerId => {
                                const runnerTasks = runnerMap.get(runnerId);
                                const row = document.createElement('tr');

                                const runnerCell = document.createElement('td');
                                runnerCell.textContent = runnerId;
                                row.appendChild(runnerCell);

                                const tasksCell = document.createElement('td');
                                const tasksList = document.createElement('div');
                                tasksList.className = 'd-flex flex-wrap gap-1';

                                runnerTasks.forEach(task => {
                                    const taskLink = document.createElement('a');
                                    taskLink.setAttribute('href', `/services?team=${encodeURIComponent(task.team_id)}&service=${encodeURIComponent(task.service_type)}`);
                                    taskLink.style.textDecoration = 'none';

                                    const taskBadge = document.createElement('span');
                                    taskBadge.className = 'badge text-bg-primary';
                                    taskBadge.textContent = `${task.service_type} (Team ${task.team_id})`;

                                    taskLink.appendChild(taskBadge);
                                    tasksList.appendChild(taskLink);
                                });

                                tasksCell.appendChild(tasksList);
                                row.appendChild(tasksCell);

                                const timeCell = document.createElement('td');
                                let longestRunningTask = null;
                                let longestElapsedTime = 0;

                                runnerTasks.forEach(task => {
                                    if (task.start_time) {
                                        const startTime = new Date(task.start_time);
                                        const now = new Date();
                                        const elapsedSeconds = Math.round((now - startTime) / 1000);

                                        if (elapsedSeconds > longestElapsedTime) {
                                            longestElapsedTime = elapsedSeconds;
                                            longestRunningTask = task;
                                        }
                                    }
                                });

                                if (longestRunningTask) {
                                    const progressContainer = document.createElement('div');
                                    progressContainer.className = 'progress';
                                    progressContainer.setAttribute('role', 'progressbar');

                                    const progressBar = document.createElement('div');
                                    const roundDuration = ROUNDDURATION || Math.max(60, longestElapsedTime * 2);
                                    const progressPercent = Math.min(100, Math.round((longestElapsedTime / roundDuration) * 100));

                                    progressBar.style.width = `${progressPercent}%`;
                                    progressBar.textContent = `${longestElapsedTime}s`;

                                    if (progressPercent > 80) {
                                        progressBar.className = 'progress-bar bg-danger';
                                    } else if (progressPercent > 50) {
                                        progressBar.className = 'progress-bar bg-warning';
                                    } else {
                                        progressBar.className = 'progress-bar bg-success';
                                    }

                                    progressContainer.appendChild(progressBar);
                                    timeCell.appendChild(progressContainer);
                                } else {
                                    timeCell.textContent = 'Unknown';
                                }

                                row.appendChild(timeCell);
                                tbody.appendChild(row);
                            });

                            table.appendChild(tbody);
                            activeRunnersContainer.innerHTML = '';
                            activeRunnersContainer.appendChild(table);
                        })
                        .catch(error => {
                            console.error('Error fetching runner tasks:', error);
                            document.getElementById('activeRunnersList').innerHTML =
                                '<p class="text-danger mb-0">Error loading runner tasks.</p>';
                        });
                }

                document.getElementById('autoRefreshSwitch').addEventListener('change', (e) => {
                    autoRefreshEnabled = e.target.checked;
                    if (autoRefreshEnabled) {
                        getEngineData();
                        updateRunnerTasks();
                        refreshInterval = setInterval(updateRunnerTasks, 2000);
                    } else {
                        clearInterval(refreshInterval);
                    }
                });

                function getEngineData() {
                    if (!autoRefreshEnabled) return;
                    fetch('/api/engine')
                        .then(response => {
                            if (!response.ok) throw new Error(`HTTP ${response.status}`);
                            return response.json();
                        })
                        .then(data => {
                            LASTROUND = data["last_round"] || { ID: 0, StartTime: new Date().toISOString() };
                            CURRENTROUND = data["current_round_time"];
                            NEXTROUND = data["next_round_time"];
                            RUNNING = data["running"];

                            const startTime = new Date(CURRENTROUND).getTime() / 1000;
                            const endTime = new Date(NEXTROUND).getTime() / 1000;
                            ROUNDDURATION = Math.round(endTime - startTime);

                            const last_round_start_time = new Date(LASTROUND.StartTime).toLocaleString();
                            const current_round_time = new Date(CURRENTROUND).toLocaleString();
                            const next_round_time = new Date(NEXTROUND).toLocaleString();

                            document.getElementById('round__number').textContent = `Round ${LASTROUND.ID} was at ${last_round_start_time}. Round ${LASTROUND.ID + 1} started at ${current_round_time} and should end at ${next_round_time}.`;
                        })
                        .catch(error => console.error('Error fetching engine status:', error));
                }

                function updateProgress() {
                    if (!CURRENTROUND || !NEXTROUND) return;
                    const now = Date.now() / 1000;
                    const last_round_start_time = new Date(CURRENTROUND) / 1000;
                    const next_round_start_time = new Date(NEXTROUND) / 1000;

                    const elapsed = now - last_round_start_time;
                    const duration = Math.max(1, next_round_start_time - last_round_start_time);

                    const progress = Math.max(0, Math.round((elapsed / duration) * 100));

                    if (progress >= 100) {
                        PROGRESS.textContent = '100%';
                        PROGRESS.style.width = '100%';
                        PROGRESS.setAttribute('aria-valuenow', 100);
                        if (RUNNING && autoRefreshEnabled && Date.now() - lastRolloverFetch > 3000) {
                            lastRolloverFetch = Date.now();
                            getEngineData();
                            updateRunnerTasks();
                        }
                        return;
                    }

                    PROGRESS.textContent = `${progress}%`;
                    PROGRESS.style.width = `${progress}%`;
                    PROGRESS.setAttribute('aria-valuenow', progress);
                }

                // Initialize
                updateRunnerTasks();
                getEngineData();
                updateProgress();

                // Poll runner tasks every 2s and engine metadata every 10s (progress bar updates locally every 1s)
                refreshInterval = setInterval(updateRunnerTasks, 2000);
                setInterval(updateProgress, 1000);
                setInterval(() => {
                    if (autoRefreshEnabled) getEngineData();
                }, 10000);
            </script>
        </div>
    </div>
</div>
{{ end }}
