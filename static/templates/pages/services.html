{{ define "page" }}
<div class="d-flex w-100 h-100">
    <div class="pt-4 w-100 h-100 overflow-y-scroll">
        <div class="container">
            <div class="row mb-3">
                <div class="d-flex p-0">
                    <div>
                        <select class="form-select" id="team-select">
                        </select>
                    </div>
                </div>
            </div>
            <div class="row" id="service-container">
                <button
                    class="d-none d-flex flex-grow-1 nav-link service-button text-start border rounded-1 mb-3 p-4 w-100"
                    type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvas" data-service-id="placeholder"
                    aria-controls="offcanvas" id="service--placeholder">
                    <div class="container">
                        <div class="row">
                            <div class="col">
                                <div class="d-flex flex-column h-100">
                                    <b>Name</b>
                                    <div class="d-flex flex-grow-1 align-items-center w-100"
                                        id="service__name--placeholder">
                                        Template
                                    </div>
                                </div>
                            </div>
                            <div class="d-block d-md-none w-100"></div>
                            <div class="col">
                                <div class="d-flex flex-column h-100 ">
                                    <b>Uptime</b>
                                    <div class="d-flex flex-grow-1 align-items-center w-100">
                                        <div class="progress text-center w-100 position-relative" role="progressbar">
                                            <div class="position-absolute d-flex w-100 justify-content-center"
                                                id="service__uptime__text--placeholder">
                                            </div>
                                            <div class="progress-bar" id="service__uptime--placeholder"
                                                style="width:80%">
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="d-block d-md-none w-100"></div>
                            <div class="col-1">
                                <div class="d-flex flex-column h-100 ">
                                    <b>SLAs</b>
                                    <div class="d-flex flex-grow-1 align-items-center w-100">
                                        <span class="badge text-bg-secondary" id="service__slas--placeholder"></span>
                                    </div>
                                </div>
                            </div>
                            <div class="d-block d-md-none w-100"></div>
                            <div class="col">
                                <div class="d-flex flex-column h-100">
                                    <b> Last 10 Rounds</b>
                                    <div class="d-flex flex-grow-1 align-items-center w-100"
                                        id="service__checks--placeholder">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </button>
            </div>
        </div>
    </div>
</div>

<div class="offcanvas offcanvas-bottom" tabindex="-1" id="offcanvas" aria-labelledby="drilldown__label"
    style="height:100vh">
    <div class="offcanvas-header">
        <button type="button" class="btn p-4" data-bs-dismiss="offcanvas" aria-label="Close">
            <i class="bi bi-arrow-left"></i>
        </button>
        <h5 class="offcanvas-title" id="drilldown__label">Title</h5>
    </div>
    <div class="offcanvas-body small">
        {{ if contains .roles "admin" }}
        <div id="drilldown__custom-check" class="card mb-3 d-none">
            <div class="card-header d-flex flex-wrap justify-content-between align-items-center gap-2 py-2">
                <span class="fw-semibold">
                    <i class="bi bi-file-earmark-code me-1 text-primary" aria-hidden="true"></i>Custom Check Definition
                </span>
                <div class="d-flex flex-wrap align-items-center gap-1">
                    <span class="badge text-bg-secondary" id="drilldown__custom-box"></span>
                    <span class="badge bg-body-tertiary text-body border" id="drilldown__custom-meta"></span>
                    <span class="badge bg-info-subtle text-info-emphasis border border-info-subtle d-none" id="drilldown__custom-credlist"></span>
                </div>
            </div>
            <div class="card-body py-2">
                <div class="mb-1"><strong>Command:</strong> <code id="drilldown__custom-command" class="text-break"></code></div>
                <div class="mb-1 d-none" id="drilldown__custom-regex-row"><strong>Expected Regex:</strong> <code id="drilldown__custom-regex" class="text-break"></code></div>
                <details id="drilldown__custom-script-details" class="mt-2 d-none">
                    <summary class="fw-semibold user-select-none" id="drilldown__custom-script-summary">Script Source</summary>
                    <div id="drilldown__custom-script-error" class="alert alert-warning py-2 mt-2 mb-0 d-none"></div>
                    <div id="drilldown__custom-script-wrapper" class="mt-2 d-none">
                        <div class="d-flex justify-content-between align-items-center bg-body-secondary border border-bottom-0 rounded-top px-3 py-1">
                            <code class="text-body-secondary" id="drilldown__custom-script-path-label"></code>
                            <button type="button" class="btn btn-sm btn-outline-secondary py-0 px-2" id="drilldown__custom-copy-btn" aria-live="polite">Copy</button>
                        </div>
                        <pre class="bg-body-tertiary p-3 rounded-bottom border mb-0" style="max-height: 400px; overflow: auto; tab-size: 4;"><code id="drilldown__custom-script-content"></code></pre>
                    </div>
                </details>
                <div id="drilldown__custom-helpers"></div>
            </div>
        </div>
        {{ end }}
        <table class="table">
            <thead>
                <tr>
                    <th>Round</th>
                    <th>Time</th>
                    <th>Result</th>
                    <th>Debug</th>
                    <th>Error</th>
                </tr>
            </thead>
            <tbody id="drilldown__list">
                <tr class="placeholder-glow" id="drilldown__row--placeholder">
                    <td width="10%"><span class="placeholder col-12"></span></td>
                    <td width="20%"><span class="placeholder col-12"></span></td>
                    <td width="10%"><span class="placeholder col-12"></span></td>
                    <td width="30%"><span class="placeholder col-12"></span></td>
                    <td width="30%"><span class="placeholder col-12"></span></td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const SERVICE_CONTAINER = document.getElementById("service-container")
    const PLACEHOLDER_SERVICE = document.getElementById("service--placeholder")
    const DRILLDOWN_TITLE = document.getElementById("drilldown__label")
    const DRILLDOWN_PLACEHOLDER = document.getElementById("drilldown__row--placeholder")
    const DRILLDOWN_LIST = document.getElementById("drilldown__list")
    {{ if contains .roles "admin" }}
    const DRILLDOWN_CUSTOM_CARD = document.getElementById("drilldown__custom-check")
    const CUSTOM_CHECK_CACHE = new Map()
    let drilldownCheckSeq = 0

    function copyDrilldownText(text, btn) {
        const writePromise = (navigator.clipboard && navigator.clipboard.writeText)
            ? navigator.clipboard.writeText(text)
            : new Promise((resolve, reject) => {
                const ta = document.createElement("textarea")
                ta.value = text
                ta.setAttribute("readonly", "")
                ta.style.position = "fixed"
                ta.style.opacity = "0"
                document.body.appendChild(ta)
                try {
                    ta.select()
                    if (document.execCommand("copy")) resolve()
                    else reject(new Error("copy failed"))
                } catch (err) {
                    reject(err)
                } finally {
                    document.body.removeChild(ta)
                }
            })
        writePromise
            .then(() => {
                btn.textContent = "Copied"
                clearTimeout(btn._timer)
                btn._timer = setTimeout(() => { btn.textContent = "Copy" }, 1500)
            })
            .catch(() => {
                btn.textContent = "Copy failed"
                clearTimeout(btn._timer)
                btn._timer = setTimeout(() => { btn.textContent = "Copy" }, 1500)
            })
    }

    function renderDrilldownCustomCheck(info) {
        if (!info) {
            DRILLDOWN_CUSTOM_CARD.classList.add("d-none")
            return
        }
        DRILLDOWN_CUSTOM_CARD.classList.remove("d-none")
        document.getElementById("drilldown__custom-box").textContent = `${info.box_name} (${info.target})`
        document.getElementById("drilldown__custom-meta").textContent = `Points: ${info.points} | Timeout: ${info.timeout}s`

        const credBadge = document.getElementById("drilldown__custom-credlist")
        if (info.credlists && info.credlists.length > 0) {
            credBadge.classList.remove("d-none")
            credBadge.textContent = `Credlist: ${info.credlists.join(", ")}`
        } else {
            credBadge.classList.add("d-none")
        }

        document.getElementById("drilldown__custom-command").textContent = info.command || ""

        const regexRow = document.getElementById("drilldown__custom-regex-row")
        if (info.regex) {
            regexRow.classList.remove("d-none")
            document.getElementById("drilldown__custom-regex").textContent = info.regex
        } else {
            regexRow.classList.add("d-none")
        }

        const scriptDetails = document.getElementById("drilldown__custom-script-details")
        scriptDetails.open = false
        if (info.script_path) {
            scriptDetails.classList.remove("d-none")
            document.getElementById("drilldown__custom-script-summary").textContent = `Script Source: ${info.script_path}`
            const errEl = document.getElementById("drilldown__custom-script-error")
            const wrapperEl = document.getElementById("drilldown__custom-script-wrapper")
            if (info.script_error) {
                errEl.textContent = info.script_error
                errEl.classList.remove("d-none")
                wrapperEl.classList.add("d-none")
            } else {
                errEl.classList.add("d-none")
                wrapperEl.classList.remove("d-none")
                document.getElementById("drilldown__custom-script-path-label").textContent = info.script_path
                document.getElementById("drilldown__custom-script-content").textContent = info.script_content || ""
                const copyBtn = document.getElementById("drilldown__custom-copy-btn")
                copyBtn.textContent = "Copy"
                copyBtn.onclick = () => copyDrilldownText(info.script_content || "", copyBtn)
            }
        } else {
            scriptDetails.classList.add("d-none")
        }

        const helpersContainer = document.getElementById("drilldown__custom-helpers")
        helpersContainer.textContent = ""
        if (info.helpers && info.helpers.length > 0) {
            info.helpers.forEach((h) => {
                const hd = scriptDetails.cloneNode(true)
                hd.id = ""
                hd.classList.remove("d-none")
                hd.open = false
                hd.querySelector("summary").textContent = `Shared Module: ${h.path}`
                hd.querySelector(".alert").classList.add("d-none")
                const hw = hd.querySelector("#drilldown__custom-script-wrapper")
                hw.id = ""
                hw.classList.remove("d-none")
                hw.querySelector("code").textContent = h.path
                hw.querySelector("pre code").textContent = h.content || ""
                const hBtn = hw.querySelector("button")
                hBtn.id = ""
                hBtn.textContent = "Copy"
                hBtn.onclick = () => copyDrilldownText(h.content || "", hBtn)
                helpersContainer.appendChild(hd)
            })
        }
    }

    function updateDrilldownCustomCheck(serviceName) {
        if (!DRILLDOWN_CUSTOM_CARD) return
        if (CUSTOM_CHECK_CACHE.has(serviceName)) {
            renderDrilldownCustomCheck(CUSTOM_CHECK_CACHE.get(serviceName))
            return
        }
        DRILLDOWN_CUSTOM_CARD.classList.add("d-none")
        const seq = ++drilldownCheckSeq

        fetch(`/api/admin/checks?service=${encodeURIComponent(serviceName)}`)
            .then((res) => res.ok ? res.json() : [])
            .then((checks) => {
                const info = Array.isArray(checks) && checks.length > 0 ? checks[0] : null
                CUSTOM_CHECK_CACHE.set(serviceName, info)
                if (seq !== drilldownCheckSeq) return
                renderDrilldownCustomCheck(info)
            })
            .catch(() => {})
    }
    {{ end }}

    function updateUrlParams(params) {
        const url = new URL(window.location)
        for (const [key, value] of Object.entries(params)) {
            if (value === null || value === undefined) {
                url.searchParams.delete(key)
            } else {
                url.searchParams.set(key, value)
            }
        }
        window.history.replaceState({}, '', url)
    }

    document.getElementById('offcanvas').addEventListener('hidden.bs.offcanvas', () => {
        updateUrlParams({ service: null, round: null })
    })

    fetch("/api/teams")
        .then((response) => {
            if (!response.ok) {
                Promise.reject(response)
            }
            return response.json()
        })
        .then((data) => {
            let teams = data
            let team_select = document.getElementById("team-select")
            for (const i in teams) {
                let team = teams[i]
                let option = document.createElement("option")
                option.value = team.ID
                option.textContent = team.Name
                team_select.appendChild(option)
            }
            team_select.addEventListener("change", (source) => {
                SERVICE_CONTAINER.innerHTML = ""
                const TEAM_ID = source.currentTarget.value
                updateUrlParams({ team: TEAM_ID, service: null, round: null })
                fetchServices(TEAM_ID)
            })
        })
        .then(() => {
            // Check URL parameters for team and service
            const urlParams = new URLSearchParams(window.location.search);
            const teamParam = urlParams.get('team');
            const serviceParam = urlParams.get('service');
            const roundParam = urlParams.get('round');

            if (teamParam) {
                // Set the team dropdown to the team from URL, but only if it's a valid option
                const teamSelect = document.getElementById("team-select");
                // Check if teamParam is a valid option
                const isValidOption = Array.from(teamSelect.options).some(option => option.value === teamParam);
                if (isValidOption) {
                    teamSelect.value = teamParam;
                }
            }

            const TEAM_ID = document.getElementById("team-select").value;
            // We'll validate serviceParam inside fetchServices after we have the list of services
            fetchServices(TEAM_ID, serviceParam, roundParam);
        })

    function fetchServices(team_id, highlightServiceName = null, highlightRound = null) {
        fetch(`/api/services/${team_id}`)
            .then((response) => {
                if (!response.ok) {
                    Promise.reject(response)
                }
                return response.json()
            })
            .then((data) => {
                let services = [];
                if (data === null) {
                    const message = document.createElement("div")
                    message.classList.add("alert", "alert-warning")
                    message.textContent = "No services found for this team."
                    SERVICE_CONTAINER.appendChild(message)
                    return
                }
                // Validate highlightServiceName against available services
                let validServiceName = null;
                if (highlightServiceName) {
                    // Check if highlightServiceName exists in the data
                    const serviceExists = data.some(summary => summary.ServiceName === highlightServiceName);
                    if (serviceExists) {
                        validServiceName = highlightServiceName;
                    }
                }

                for (const SUMMARY of data) {
                    const SERVICENAME = SUMMARY.ServiceName
                    const SLACOUNT = SUMMARY.SlaCount
                    const LAST10ROUNDS = SUMMARY.Last10Rounds
                    const UPTIME = Math.round(SUMMARY.Uptime * 100)

                    let service = PLACEHOLDER_SERVICE.cloneNode(true)
                    service.classList.remove("placeholder-glow", "d-none")

                    let name = service.querySelector("#service__name--placeholder")
                    let uptime = service.querySelector("#service__uptime--placeholder")
                    let uptime_text = service.querySelector("#service__uptime__text--placeholder")
                    let slas = service.querySelector("#service__slas--placeholder")
                    let checks = service.querySelector("#service__checks--placeholder")

                    name.className = ""
                    // uptime.className = ""
                    checks.className = ""

                    slas.textContent = SLACOUNT
                    name.textContent = SERVICENAME
                    uptime_text.textContent = UPTIME + "%"
                    uptime.style.width = UPTIME + "%"
                    if (UPTIME >= 80) {
                        uptime.classList.add("bg-success")
                    } else if (UPTIME >= 50) {
                        uptime.classList.add("bg-warning")
                    } else {
                        uptime.classList.add("bg-danger")
                    }

                    for (const round of LAST10ROUNDS) {
                        let checkFoundInRound = false
                        for (const check of round.Checks) {
                            if (SERVICENAME == check.ServiceName) {
                                checkFoundInRound = true
                                let icon = document.createElement("img")
                                if (check.Result) {
                                    icon.src = "/static/assets/services/up.png"
                                } else {
                                    icon.src = "/static/assets/services/down.png"
                                }
                                icon.height = 25
                                icon.width = 25
                                icon.setAttribute("data-bs-toggle", "tooltip")
                                icon.setAttribute("data-bs-title", (new Date(round.StartTime)).toLocaleString())
                                checks.appendChild(icon)
                            }
                        }
                        if (!checkFoundInRound) {
                            let icon = document.createElement("img")
                            icon.src = "/static/assets/services/pending.png"
                            icon.height = 25
                            icon.width = 25
                            icon.setAttribute("data-bs-toggle", "tooltip")
                            icon.setAttribute("data-bs-title", (new Date(round.StartTime)).toLocaleString())
                            checks.appendChild(icon)
                        }
                    }

                    // Set the data-service-id attribute (this is what's actually used in the click handler)
                    service.setAttribute("data-service-id", SERVICENAME)

                    // If this is the service we want to highlight (from task card click)
                    if (validServiceName && SERVICENAME === validServiceName) {
                        // Add a highlight class to this service
                        service.classList.add('border-primary', 'border-2')

                        if (highlightRound) {
                            service.dataset.highlightRound = highlightRound
                        }

                        // Auto-click this service to show details
                        setTimeout(() => {
                            service.click()
                        }, 500)
                    }

                    services.push(service)
                }

                for (let i = 0; i < services.length; i++) {
                    SERVICE_CONTAINER.appendChild(services[i])
                }
            })
            .then(() => {
                const tooltipTriggerList = document.querySelectorAll('[data-bs-toggle="tooltip"]')
                const tooltipList = [...tooltipTriggerList].map(tooltipTriggerEl => new bootstrap.Tooltip(tooltipTriggerEl))
            })
            .then(() => {
                document.querySelectorAll(".service-button").forEach((button) => {
                    button.addEventListener("click", (source) => {
                        const SERVICE_ID = source.currentTarget.getAttribute("data-service-id")
                        const TEAM_ID = document.getElementById("team-select").value
                        const HIGHLIGHT_ROUND = source.currentTarget.getAttribute("data-highlight-round")
                        updateUrlParams({ team: TEAM_ID, service: SERVICE_ID, round: HIGHLIGHT_ROUND })
                        DRILLDOWN_TITLE.textContent = "Service: " + SERVICE_ID
                        {{ if contains .roles "admin" }}
                        updateDrilldownCustomCheck(SERVICE_ID)
                        {{ end }}
                        DRILLDOWN_LIST.textContent = ""
                        DRILLDOWN_LIST.appendChild(DRILLDOWN_PLACEHOLDER.cloneNode(true))
                        fetch(`/api/services/${TEAM_ID}/${SERVICE_ID}`)
                            .then((response) => {
                                if (!response.ok) {
                                    Promise.reject(response)
                                }
                                return response.json()
                            })
                            .then((data) => {
                                for (const a of data) {
                                    let row = DRILLDOWN_PLACEHOLDER.cloneNode(true)
                                    row.id = ""
                                    row.childNodes[1].textContent = a.Round.ID
                                    row.childNodes[3].textContent = (new Date(a.Round.StartTime)).toLocaleString()
                                    row.childNodes[5].textContent = a.Result
                                    row.childNodes[7].textContent = a.Debug
                                    row.childNodes[9].textContent = a.Error
                                    if (HIGHLIGHT_ROUND && parseInt(HIGHLIGHT_ROUND) === a.Round.ID) {
                                        row.classList.add('table-primary')
                                    }
                                    DRILLDOWN_LIST.appendChild(row)
                                }
                                DRILLDOWN_LIST.removeChild(DRILLDOWN_LIST.childNodes[0])
                                if (source.currentTarget) source.currentTarget.removeAttribute('data-highlight-round')
                            })
                    })
                })
            })
    }
</script>
{{ end }}
