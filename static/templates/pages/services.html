{{ define "page" }}
<style>
    .service-drilldown-drawer {
        --bs-offcanvas-width: min(68vw, 960px);
    }
    @media (max-width: 767.98px) {
        .service-drilldown-drawer {
            --bs-offcanvas-width: 100vw;
        }
    }
    .service-round-icons {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
        align-items: center;
    }
</style>
<div class="d-flex w-100 h-100">
    <div class="pt-4 w-100 h-100 overflow-y-scroll">
        <div class="container">
            <header class="d-flex flex-wrap justify-content-between align-items-end mb-4 gap-3">
                <div>
                    <h1 class="h3 mb-1">Service Status</h1>
                    <p class="text-body-secondary mb-0">Inspect service uptime, SLA violations, and round-by-round check results.</p>
                </div>
                <div class="d-flex align-items-center gap-2">
                    <label for="team-select" class="form-label fw-semibold mb-0 text-nowrap">Team</label>
                    <select class="form-select" id="team-select" aria-label="Select team">
                    </select>
                </div>
            </header>

            <div id="services-error" class="alert alert-danger d-none" role="alert"></div>

            <div class="row" id="service-container">
                <button
                    class="d-none d-flex flex-grow-1 nav-link service-button text-start border rounded-2 mb-3 p-4 w-100 bg-body"
                    type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvas" data-service-id="placeholder"
                    aria-controls="offcanvas" id="service--placeholder">
                    <div class="container-fluid px-0">
                        <div class="row g-3 align-items-center">
                            <div class="col-12 col-md-3">
                                <div class="d-flex flex-column h-100">
                                    <span class="small text-body-secondary fw-semibold">Service</span>
                                    <div class="d-flex flex-grow-1 align-items-center w-100 fw-semibold fs-5"
                                        id="service__name--placeholder">
                                        Template
                                    </div>
                                </div>
                            </div>
                            <div class="col-8 col-md-3">
                                <div class="d-flex flex-column h-100">
                                    <span class="small text-body-secondary fw-semibold mb-1">Uptime</span>
                                    <div class="d-flex flex-grow-1 align-items-center w-100">
                                        <div class="progress text-center w-100 position-relative" role="progressbar"
                                            id="service__progress--placeholder" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                                            <div class="position-absolute d-flex w-100 justify-content-center fw-semibold"
                                                id="service__uptime__text--placeholder">
                                            </div>
                                            <div class="progress-bar" id="service__uptime--placeholder"
                                                style="width:80%">
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="col-4 col-md-2">
                                <div class="d-flex flex-column h-100">
                                    <span class="small text-body-secondary fw-semibold mb-1">SLA Violations</span>
                                    <div class="d-flex flex-grow-1 align-items-center w-100">
                                        <span class="badge text-bg-secondary" id="service__slas--placeholder"></span>
                                    </div>
                                </div>
                            </div>
                            <div class="col-12 col-md-4">
                                <div class="d-flex flex-column h-100">
                                    <span class="small text-body-secondary fw-semibold mb-1">Last 10 Rounds</span>
                                    <div class="service-round-icons"
                                        id="service__checks--placeholder">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </button>
            </div>
        </div>
    </div>
</div>

<div class="offcanvas offcanvas-end service-drilldown-drawer" tabindex="-1" id="offcanvas" aria-labelledby="drilldown__label">
    <div class="offcanvas-header border-bottom">
        <h2 class="offcanvas-title h5 mb-0" id="drilldown__label">Service History</h2>
        <div class="d-flex align-items-center gap-2 ms-auto">
            <button type="button" class="btn btn-sm btn-outline-primary" id="drilldown-refresh-btn" title="Refresh check history">
                <i class="bi bi-arrow-clockwise me-1" aria-hidden="true"></i>Refresh
            </button>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
    </div>
    <div class="offcanvas-body small">
        <div id="drilldown-error" class="alert alert-danger d-none" role="alert"></div>
        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                    <tr>
                        <th scope="col">Round</th>
                        <th scope="col">Time</th>
                        <th scope="col">Result</th>
                        <th scope="col">Debug</th>
                        <th scope="col">Error</th>
                    </tr>
                </thead>
                <tbody id="drilldown__list">
                    <tr class="placeholder-glow" id="drilldown__row--placeholder">
                        <td width="10%"><span class="placeholder col-12"></span></td>
                        <td width="20%"><span class="placeholder col-12"></span></td>
                        <td width="10%"><span class="placeholder col-12"></span></td>
                        <td width="30%"><span class="placeholder col-12"></span></td>
                        <td width="30%"><span class="placeholder col-12"></span></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    const SERVICE_CONTAINER = document.getElementById("service-container")
    const PLACEHOLDER_SERVICE = document.getElementById("service--placeholder")
    const DRILLDOWN_TITLE = document.getElementById("drilldown__label")
    const DRILLDOWN_PLACEHOLDER = document.getElementById("drilldown__row--placeholder")
    const DRILLDOWN_LIST = document.getElementById("drilldown__list")
    const DRILLDOWN_ERROR = document.getElementById("drilldown-error")
    const SERVICES_ERROR = document.getElementById("services-error")
    let currentDrilldownService = null
    let currentHighlightRound = null

    function updateUrlParams(params) {
        const url = new URL(window.location)
        for (const [key, value] of Object.entries(params)) {
            if (value === null || value === undefined) {
                url.searchParams.delete(key)
            } else {
                url.searchParams.set(key, value)
            }
        }
        window.history.replaceState({}, '', url)
    }

    document.getElementById('offcanvas').addEventListener('hidden.bs.offcanvas', () => {
        currentDrilldownService = null
        currentHighlightRound = null
        updateUrlParams({ service: null, round: null })
    })

    document.getElementById('drilldown-refresh-btn').addEventListener('click', () => {
        if (currentDrilldownService) {
            const teamId = document.getElementById("team-select").value
            loadServiceDrilldown(teamId, currentDrilldownService, currentHighlightRound)
        }
    })

    function loadServiceDrilldown(teamId, serviceId, highlightRound = null) {
        currentDrilldownService = serviceId
        currentHighlightRound = highlightRound
        DRILLDOWN_TITLE.textContent = "Service: " + serviceId
        DRILLDOWN_ERROR.classList.add("d-none")
        DRILLDOWN_LIST.textContent = ""
        DRILLDOWN_LIST.appendChild(DRILLDOWN_PLACEHOLDER.cloneNode(true))

        fetch(`/api/services/${encodeURIComponent(teamId)}/${encodeURIComponent(serviceId)}`)
            .then((response) => {
                if (!response.ok) {
                    return Promise.reject(new Error(`Failed to load check history (HTTP ${response.status})`))
                }
                return response.json()
            })
            .then((data) => {
                DRILLDOWN_LIST.textContent = ""
                if (!data || data.length === 0) {
                    const emptyRow = document.createElement("tr")
                    const emptyCell = document.createElement("td")
                    emptyCell.colSpan = 5
                    emptyCell.className = "text-center text-body-secondary py-4"
                    emptyCell.textContent = "No check rounds recorded yet for this service."
                    emptyRow.appendChild(emptyCell)
                    DRILLDOWN_LIST.appendChild(emptyRow)
                    return
                }
                for (const a of data) {
                    const row = DRILLDOWN_PLACEHOLDER.cloneNode(true)
                    row.id = ""
                    row.classList.remove("placeholder-glow")
                    row.childNodes[1].textContent = a.Round.ID
                    row.childNodes[3].textContent = (new Date(a.Round.StartTime)).toLocaleString()

                    const resultBadge = document.createElement("span")
                    resultBadge.className = a.Result ? "badge text-bg-success" : "badge text-bg-danger"
                    resultBadge.textContent = a.Result ? "UP" : "DOWN"
                    row.childNodes[5].replaceChildren(resultBadge)

                    row.childNodes[7].textContent = a.Debug || "—"
                    if (!a.Debug) row.childNodes[7].classList.add("text-body-secondary")

                    row.childNodes[9].textContent = a.Error || "—"
                    if (!a.Error) row.childNodes[9].classList.add("text-body-secondary")

                    if (highlightRound && parseInt(highlightRound) === a.Round.ID) {
                        row.classList.add('table-primary')
                    }
                    DRILLDOWN_LIST.appendChild(row)
                }
            })
            .catch((err) => {
                console.error(err)
                DRILLDOWN_LIST.textContent = ""
                DRILLDOWN_ERROR.textContent = err.message || "Failed to load service check history."
                DRILLDOWN_ERROR.classList.remove("d-none")
            })
    }

    fetch("/api/teams")
        .then((response) => {
            if (!response.ok) {
                return Promise.reject(new Error(`Failed to load teams (HTTP ${response.status})`))
            }
            return response.json()
        })
        .then((data) => {
            const teams = data || []
            const teamSelect = document.getElementById("team-select")
            for (const team of teams) {
                const option = document.createElement("option")
                option.value = team.ID
                option.textContent = team.Name
                teamSelect.appendChild(option)
            }
            teamSelect.addEventListener("change", (source) => {
                SERVICE_CONTAINER.innerHTML = ""
                const TEAM_ID = source.currentTarget.value
                updateUrlParams({ team: TEAM_ID, service: null, round: null })
                fetchServices(TEAM_ID)
            })
        })
        .then(() => {
            const urlParams = new URLSearchParams(window.location.search)
            const teamParam = urlParams.get('team')
            const serviceParam = urlParams.get('service')
            const roundParam = urlParams.get('round')

            if (teamParam) {
                const teamSelect = document.getElementById("team-select")
                const isValidOption = Array.from(teamSelect.options).some(option => option.value === teamParam)
                if (isValidOption) {
                    teamSelect.value = teamParam
                }
            }

            const TEAM_ID = document.getElementById("team-select").value
            if (TEAM_ID) {
                fetchServices(TEAM_ID, serviceParam, roundParam)
            }
        })
        .catch((err) => {
            console.error(err)
            SERVICES_ERROR.textContent = err.message || "Failed to load teams."
            SERVICES_ERROR.classList.remove("d-none")
        })

    function fetchServices(team_id, highlightServiceName = null, highlightRound = null) {
        SERVICES_ERROR.classList.add("d-none")
        fetch(`/api/services/${encodeURIComponent(team_id)}`)
            .then((response) => {
                if (!response.ok) {
                    return Promise.reject(new Error(`Failed to load services (HTTP ${response.status})`))
                }
                return response.json()
            })
            .then((data) => {
                const services = []
                if (!data || data.length === 0) {
                    const message = document.createElement("div")
                    message.classList.add("alert", "alert-warning")
                    message.textContent = "No services found for this team."
                    SERVICE_CONTAINER.appendChild(message)
                    return
                }

                let validServiceName = null
                if (highlightServiceName) {
                    const serviceExists = data.some(summary => summary.ServiceName === highlightServiceName)
                    if (serviceExists) {
                        validServiceName = highlightServiceName
                    }
                }

                for (const SUMMARY of data) {
                    const SERVICENAME = SUMMARY.ServiceName
                    const SLACOUNT = SUMMARY.SlaCount
                    const LAST10ROUNDS = SUMMARY.Last10Rounds || []
                    const UPTIME = Math.round(SUMMARY.Uptime * 100)

                    const service = PLACEHOLDER_SERVICE.cloneNode(true)
                    service.id = `service--${SERVICENAME}`
                    service.classList.remove("placeholder-glow", "d-none")

                    const name = service.querySelector("#service__name--placeholder")
                    const progress = service.querySelector("#service__progress--placeholder")
                    const uptime = service.querySelector("#service__uptime--placeholder")
                    const uptimeText = service.querySelector("#service__uptime__text--placeholder")
                    const slas = service.querySelector("#service__slas--placeholder")
                    const checks = service.querySelector("#service__checks--placeholder")

                    name.id = `service__name--${SERVICENAME}`
                    progress.id = `service__progress--${SERVICENAME}`
                    uptime.id = `service__uptime--${SERVICENAME}`
                    uptimeText.id = `service__uptime__text--${SERVICENAME}`
                    slas.id = `service__slas--${SERVICENAME}`
                    checks.id = `service__checks--${SERVICENAME}`

                    progress.setAttribute("aria-valuenow", String(UPTIME))
                    progress.setAttribute("aria-label", `${SERVICENAME} uptime ${UPTIME}%`)

                    slas.textContent = SLACOUNT
                    slas.className = SLACOUNT > 0 ? "badge text-bg-danger" : "badge text-bg-secondary"
                    name.textContent = SERVICENAME
                    uptimeText.textContent = UPTIME + "%"
                    uptime.style.width = UPTIME + "%"
                    if (UPTIME >= 80) {
                        uptime.classList.add("bg-success")
                    } else if (UPTIME >= 50) {
                        uptime.classList.add("bg-warning")
                    } else {
                        uptime.classList.add("bg-danger")
                    }

                    for (const round of LAST10ROUNDS) {
                        let checkFoundInRound = false
                        const roundTime = (new Date(round.StartTime)).toLocaleString()
                        for (const check of (round.Checks || [])) {
                            if (SERVICENAME == check.ServiceName) {
                                checkFoundInRound = true
                                const icon = document.createElement("img")
                                if (check.Result) {
                                    icon.src = "/static/assets/services/up.png"
                                    icon.alt = `Round ${round.ID}: Up (${roundTime})`
                                } else {
                                    icon.src = "/static/assets/services/down.png"
                                    icon.alt = `Round ${round.ID}: Down (${roundTime})`
                                }
                                icon.height = 25
                                icon.width = 25
                                icon.setAttribute("data-bs-toggle", "tooltip")
                                icon.setAttribute("data-bs-title", `Round ${round.ID}: ${check.Result ? 'UP' : 'DOWN'} (${roundTime})`)
                                checks.appendChild(icon)
                            }
                        }
                        if (!checkFoundInRound) {
                            const icon = document.createElement("img")
                            icon.src = "/static/assets/services/pending.png"
                            icon.alt = `Round ${round.ID}: Pending (${roundTime})`
                            icon.height = 25
                            icon.width = 25
                            icon.setAttribute("data-bs-toggle", "tooltip")
                            icon.setAttribute("data-bs-title", `Round ${round.ID}: Pending (${roundTime})`)
                            checks.appendChild(icon)
                        }
                    }

                    service.setAttribute("data-service-id", SERVICENAME)

                    if (validServiceName && SERVICENAME === validServiceName) {
                        service.classList.add('border-primary', 'border-2')

                        if (highlightRound) {
                            service.dataset.highlightRound = highlightRound
                        }

                        setTimeout(() => {
                            service.click()
                        }, 300)
                    }

                    services.push(service)
                }

                for (let i = 0; i < services.length; i++) {
                    SERVICE_CONTAINER.appendChild(services[i])
                }
            })
            .then(() => {
                const tooltipTriggerList = document.querySelectorAll('[data-bs-toggle="tooltip"]')
                ;[...tooltipTriggerList].map(tooltipTriggerEl => new bootstrap.Tooltip(tooltipTriggerEl))
            })
            .then(() => {
                document.querySelectorAll(".service-button:not(#service--placeholder)").forEach((button) => {
                    button.addEventListener("click", (source) => {
                        const SERVICE_ID = source.currentTarget.getAttribute("data-service-id")
                        const TEAM_ID = document.getElementById("team-select").value
                        const HIGHLIGHT_ROUND = source.currentTarget.getAttribute("data-highlight-round")
                        updateUrlParams({ team: TEAM_ID, service: SERVICE_ID, round: HIGHLIGHT_ROUND })
                        loadServiceDrilldown(TEAM_ID, SERVICE_ID, HIGHLIGHT_ROUND)
                        if (source.currentTarget) source.currentTarget.removeAttribute('data-highlight-round')
                    })
                })
            })
            .catch((err) => {
                console.error(err)
                SERVICES_ERROR.textContent = err.message || "Failed to load services."
                SERVICES_ERROR.classList.remove("d-none")
            })
    }
</script>
{{ end }}
