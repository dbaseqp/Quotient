{{ define "content" }}

<div class="d-flex flex-column flex-md-row h-100">
    {{ if ne .username nil }}
    {{ template "navbar" . }}
    {{ end }}
    <main class="d-flex flex-column flex-grow-1 justify-content-start align-items-stretch w-auto h-100 overflow-hidden"
        style="max-height: 100%;">
        {{ template "topnav" . }}
        {{ template "page" . }}
    </main>
</div>
{{ end }}
