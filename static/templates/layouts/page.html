{{ define "content" }}

<div class="d-flex flex-column flex-md-row h-100">
    {{ if ne .username nil }}
    {{ template "navbar" . }}
    {{ end }}
    <div class="d-none d-md-block border h-100"></div>
    <div class="d-flex flex-column flex-grow-1 w-auto h-100 overflow-hidden"
        style="max-height: 100%;">
        {{ template "topnav" . }}
        <div class="d-flex flex-grow-1 justify-content-center align-items-center w-100 overflow-hidden" style="min-height: 0;">
            {{ template "page" . }}
        </div>
    </div>
</div>
{{ end }}
