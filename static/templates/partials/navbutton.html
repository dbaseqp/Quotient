{{ define "navbutton" }}
{{ $pipe := index . "pipe"}}
{{ $isActive := eq $pipe.title (index . "title") }}
<a class='nav-link p-3 rounded-1 mx-2 mb-2 {{ if $isActive }}active{{ end }}' {{ if $isActive }}aria-current="page"{{ end }} href="{{ index . "href" }}">
    <div class="d-flex justify-content-start align-items-center">
        <i class="bi {{ index . "icon" }} me-3" aria-hidden="true"></i>
        {{ index . "title" }}
    </div>
</a>
{{ end }}
